[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kinsoku"
dynamic = ["version"]
description = "Japanese/CJK-aware text wrapping with kinsoku shori (禁則処理) and display-width support"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["japanese", "cjk", "textwrap", "kinsoku", "east-asian-width", "terminal"]
authors = [{ name = "Toshi" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: Chinese (Simplified)",
    "Natural Language :: Chinese (Traditional)",
    "Natural Language :: Japanese",
    "Natural Language :: Korean",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Terminals",
    "Topic :: Text Processing :: General",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest", "hypothesis"]
dev = ["pytest", "hypothesis", "ruff==0.17.6", "mypy==2.3.1", "build", "twine"]

[project.urls]
Homepage = "https://github.com/toshi201/kinsoku"
Repository = "https://github.com/toshi201/kinsoku"
Issues = "https://github.com/toshi201/kinsoku/issues"
Changelog = "https://github.com/toshi201/kinsoku/blob/main/CHANGELOG.md"

[project.scripts]
kinsoku = "kinsoku.cli:main"

[tool.hatch.version]
path = "src/kinsoku/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src/kinsoku"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# tests and benchmarks use `l` for "line" in short comprehensions
"tests/**" = ["E741"]
"benchmarks/**" = ["E741"]
