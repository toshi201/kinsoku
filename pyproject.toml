[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kinsoku"
dynamic = ["version"]
description = "Japanese/CJK-aware text wrapping with kinsoku shori (禁則処理) and display-width support"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["japanese", "cjk", "textwrap", "kinsoku", "east-asian-width", "terminal"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Natural Language :: Japanese",
    "Topic :: Text Processing :: Linguistic",
    "Environment :: Console",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest", "hypothesis"]

[project.scripts]
kinsoku = "kinsoku.cli:main"

[tool.hatch.version]
path = "src/kinsoku/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# tests and benchmarks use `l` for "line" in short comprehensions
"tests/**" = ["E741"]
"benchmarks/**" = ["E741"]
